<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263b32">
  <title>الرب قريب لمن يدعوه</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
    }
    header {
      background: #263b32;
      color: white;
      text-align: center;
      padding: 14px 8px;
      font-size: 20px;
    }
    main {
      height: calc(100vh - 55px);
      width: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
    .fallback {
      text-align: center;
      padding: 20px;
    }
    .fallback a {
      display: inline-block;
      padding: 12px 22px;
      background: #263b32;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>الرب قريب لمن يدعوه</header>
  <main>
    <iframe
      src="https://le-seigneur-est-proche.blogspot.com/"
      title="مدونة الرب قريب لمن يدعوه">
    </iframe>
    <div class="fallback">
      <a href="https://le-seigneur-est-proche.blogspot.com/">
        فتح المدونة
      </a>
    </div>
  </main>
</body>
</html>
